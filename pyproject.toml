[project]
name = "poe2-pilot"
version = "0.1.0"
description = "Glanceable campaign overlay for Path of Exile 2: route, splits, level plan"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "keyboard>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poe2-pilot = "pilot.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
