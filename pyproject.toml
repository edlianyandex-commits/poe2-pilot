[project]
name = "poe2-pilot"
dynamic = ["version"]
description = "Glanceable campaign overlay for Path of Exile 2: route, splits, level plan"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{name = "edlianyandex-commits"}]
dependencies = ["PySide6>=6.7", "keyboard>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poe2-pilot = "pilot.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pilot.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
